
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: eureka
  labels:
    app: eureka

spec:
  serviceName: eureka-service
  replicas: 1

  selector:
    matchLabels:
      app: eureka

  template:
    metadata:
      labels:
        app: eureka

    spec:
      containers:
        - name: eureka
          image: thakuraniket/eureka-server:0.0.1
          imagePullPolicy: Always

          ports:
            - containerPort: 8761
              name: eureka-port

---

apiVersion: v1
kind: Service

metadata:
  name: eureka-service
  labels:
    app: eureka

spec:
  clusterIP: None

  selector:
    app: eureka

  ports:
    - port: 8761
      targetPort: 8761
      protocol: TCP
